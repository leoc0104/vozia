<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vozia dubs your videos into 29 languages in your own voice." />
    <title>Vozia — AI video dubbing in your own voice</title>
    <script>
      // Applies the saved theme before the first paint so dark-mode users never see a white flash.
      // Mirrors resolveTheme() in src/lib/theme.ts; the storage key and shape come from the zustand store.
      ;(function () {
        var preference = 'system'
        try {
          var stored = JSON.parse(localStorage.getItem('vozia-theme') || 'null')
          var value = stored && stored.state && stored.state.preference
          if (value === 'light' || value === 'dark' || value === 'system') preference = value
        } catch (error) {}
        var dark = preference === 'dark'
        if (preference === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch (error) {}
        }
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
